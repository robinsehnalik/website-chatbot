version: "3.8"

services:
  typebot-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-typebot}
      POSTGRES_USER: ${POSTGRES_USER:-typebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required in .env}
    volumes:
      - typebot_db_data:/var/lib/postgresql/data
    networks:
      - typebot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-typebot} -d ${POSTGRES_DB:-typebot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  typebot-builder:
    image: baptistearno/typebot-builder:3.4.1
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-typebot}:${POSTGRES_PASSWORD}@typebot-db:5432/${POSTGRES_DB:-typebot}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:-http://localhost:3001}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?32-char hex encryption secret required in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    depends_on:
      typebot-db:
        condition: service_healthy
    networks:
      - typebot-net

  typebot-viewer:
    image: baptistearno/typebot-viewer:3.4.1
    restart: always
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-typebot}:${POSTGRES_PASSWORD}@typebot-db:5432/${POSTGRES_DB:-typebot}
      NEXTAUTH_URL: ${NEXT_PUBLIC_VIEWER_URL:-http://localhost:3001}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
    depends_on:
      typebot-db:
        condition: service_healthy
    networks:
      - typebot-net

volumes:
  typebot_db_data:

networks:
  typebot-net:
